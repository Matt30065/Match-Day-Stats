<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" preserveAspectRatio="xMidYMax meet">
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#566365"/><stop offset=".42" stop-color="#222a2c"/><stop offset="1" stop-color="#080c0d"/></linearGradient>
